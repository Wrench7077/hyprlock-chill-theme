input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 0 #2
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    #outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    #check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    #fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    outer_color = rgba(0, 0, 0, 0.0) rgba(0, 0, 0, 0.0) 45deg
    check_color = rgba(0, 0, 0, 0.0) rgba(0, 0, 0, 0.0) 120deg
    fail_color = rgba(0, 0, 0, 0.0) rgba(0, 0, 0, 0.0) 40deg

    font_color = rgba(173, 165, 148, 0.3) #0.2)
    #font_color = rgba(216, 222, 233, 0.06) #rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 0 #-1

    font_family = Katahdin Round Bold
    #font_family = SF Pro Display Bold
    #font_family = $font
    placeholder_text = ask joe mama #Input password...
    fail_text = ask her again #$PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    #dots_text_format =
    #dots_size = 0.5
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -430
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 80 #80 #170
    #font_family = $font
    font_family = Katahdin Round Bold
    #font_family = steelfish outline regular
    color = rgba(173, 165, 148, 0.5) #rgba(173, 165, 148, 0.8)
    #color = rgba(173, 165, 148, 0.8)
    #color = rgba(016, 222, 233, 1.20)
    #color = rgba(216, 222, 233, 0.4) #rgba(106, 121, 247, 0.1) #rgba(216, 222, 233, 0.20)
    #position = 1520, -15  #1515, 15 #-30, 15
    #halign = left #right
    #valign = top
    position = 751, -12 
    halign = center
    valign = top
    zindex = 1
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 18 #20 #25
    #font_family = $font
    #font_family = steelfish outline regular
    font_family = Katahdin Round Bold
    #font_family = SF Pro Display Bold
    color = rgba(173, 165, 148, 0.5)
    #color = rgba(173, 165, 148, 0.8)
    #color = rgba(016, 222, 233, 0.20)
    #color = rgba(216, 222, 233, 0.4) #rgba(106, 121, 247, 0.08) #rgba(216, 222, 233, 0.10)
    #position = 1541, -125 #1515, -240 #-30, -240#-150
    position = 751, -135 
    halign = center #left #right
    valign = top
    zindex = 1
}

