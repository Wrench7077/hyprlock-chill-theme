##1_creamy theme that matches with kitty desert theme
# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

#$font = Monospace
#$font =  NotoSerifCJK ExtraLight
#$font = AdwaitaSans Italic
#$font = sazanami
#$font = ttf kanjistrokeorders
$font = Katahdin Round Bold

general {
    hide_cursor = true #false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    ##fav##
    path = ~/.config/hypr/wallpapers/background.jpg #mountain at night
    #path = screenshot
    blur_passes = 0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 0 #2
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    #outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    #check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    #fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    outer_color = rgba(0, 0, 0, 0.0) rgba(0, 0, 0, 0.0) 45deg
    check_color = rgba(0, 0, 0, 0.0) rgba(0, 0, 0, 0.0) 120deg
    fail_color = rgba(0, 0, 0, 0.0) rgba(0, 0, 0, 0.0) 40deg

    font_color = rgba(173, 165, 148, 0.3)
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text = ask joe mama #Input password...
    fail_text = ask her again #$PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    #dots_text_format =
    #dots_size = 0.5
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -430
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 80
    font_family = $font
    color = rgba(173, 165, 148, 0.5)
    position = 751, -12 
    halign = center
    valign = top
    zindex = 1
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 18
    font_family = $font
    color = rgba(173, 165, 148, 0.5)
    position = 751, -135 
    halign = center
    valign = top
    zindex = 1
}

# time and date box
shape {
    monitor =
    size = 390, 150
    color = rgba(41, 39, 36, 0.6)
    rounding = 28
    border_size = 6
    border_color = rgba(41, 39, 36, 0.45)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = -10, -10
    halign = right
    valign = top
    zindex = 1
}

# bottom left text 
label {
    monitor =
    text = I use Arch btw !
    color = rgba(173, 165, 148, 0.5)
    font_size = 50
    font_family = $font
    position = 20, 60
    halign = left
    valign = bottom
    zindex = 10
}

# Battery pecentage
label {
    monitor =
    text = cmd[update:1000] echo -e "$(cat /sys/class/power_supply/BAT0/capacity)"%
    color = rgba(173, 165, 148, 0.5)
    font_size = 25
    font_family = $font
    position = 17, -17
    halign = left
    valign = top
    zindex = 5
}

# Battery stat
label {
    monitor =
    text = cmd[update:1000] echo -e "$(cat /sys/class/power_supply/BAT0/status)"
    color = rgba(173, 165, 148, 0.5)
    font_size = 10
    font_family = $font
    position = 17, -67
    halign = left
    valign = top
    zindex = 5
}

# battery body
shape {
    monitor =
    size = 110, 40
    color = rgba(41, 39, 36, 0.6)
    rounding = 7
    border_size = 4
    border_color = rgba(41, 39, 36, 0.45)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 10, -10
    halign = left
    valign = top
    zindex = 4
}

# battery nub
shape {
    monitor =
    size = 5, 20 #3, 20
    color = rgba(41, 39, 36, 0.45)
    rounding = 0
    border_size = 0 #8
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 128, -24
    halign = left
    valign = top
    zindex = 4
}

# battery stat box ( charging, not charging, discharging ) 
shape {
    monitor =
    size = 110, 20
    color = rgba(41, 39, 36, 0.6)
    rounding = 4
    border_size = 4
    border_color = rgba(41, 39, 36, 0.45)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 10, -60
    halign = left
    valign = top
    zindex = 3
}

# ----------------------------------------------------------------------------
# Player stat
# ----------------------------------------------------------------------------

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/songdetail.sh)"
    color = rgba(173, 165, 148, 0.4) #rgba(116, 222, 233, 0.20)
    font_size = 27
    font_family = $font
    position = 0, 4
    halign = center
    valign = bottom
    reload_time = -1
    zindex = 4
}

# ----------------------------------------------------------------------------
# Player info box
# ----------------------------------------------------------------------------

# music info box
shape {
    monitor =
    color = rgba(41, 39, 36, 0.7)
    size = 100%, 5%
    border_size = 0
    border_color = rgba(10, 10, 10, 1)
    rounding = 0
    position = 0, 0
    halign = center
    valign = bottom
    zindex = 3
}

# music info box border ( the thin border at the top of the player stat box )
shape {
    monitor =
    color = rgba(41, 39, 36, 0.9)
    size = 100%, 0.68%
    border_size = 0
    border_color = rgba(10, 10, 10, 1)
    rounding = 0
    position = 0, 5%
    halign = center
    valign = bottom
    zindex = 4
}

# ----------------------------------------------------------------------------
# Player info Box controls ( if you have the "hide_cursor" option in hyprlock.conf set to false ) 
# ----------------------------------------------------------------------------

# music info box control: previous
shape {
    monitor =
    onclick = playerctl previous #hyprctl switchxkblayout all next
    color = rgba(0, 0, 0, 0) #rgba(100, 114, 125, 1) #0.4
    size = 33.33%, 5%
    border_size = 0
    border_color = rgba(10, 10, 10, 1)
    rounding = 0
    position = 0, 0
    halign = left
    valign = bottom
    zindex = 20
}


# music info box control: play/pause
shape {
    monitor =
    onclick = playerctl play-pause #hyprctl switchxkblayout all next
    color = rgba(0, 0, 0, 0) #rgba(100, 114, 125, 1) #0.4
    size = 33.33%, 5%
    border_size = 0
    border_color = rgba(10, 10, 10, 1)
    rounding = 0
    position = 0, 0
    halign = center
    valign = bottom
    zindex = 20
}

# music info box control: next
shape {
    monitor =
    onclick = playerctl next #hyprctl switchxkblayout all next
    color = rgba(0, 0, 0, 0) #rgba(100, 114, 125, 1) #0.4
    size = 33.33%, 5%
    border_size = 0
    border_color = rgba(10, 10, 10, 1)
    rounding = 0
    position = 0, 0
    halign = right
    valign = bottom
    zindex = 20
}
